services:
  postgres:
    image: postgres:16-alpine
    container_name: racelab-postgres
    environment:
      POSTGRES_USER: racelab
      POSTGRES_PASSWORD: racelab
      POSTGRES_DB: racelab
    ports:
      - "5448:5432"
    volumes:
      - racelab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racelab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  racelab-pgdata:
